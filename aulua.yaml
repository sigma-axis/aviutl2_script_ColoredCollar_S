# yaml-language-server: $schema=https://raw.githubusercontent.com/karoterra/aviutl2-aulua/refs/heads/main/schema/aulua.schema.json
project:
  variables:
    NAME: ColoredCollar_S
    AUTHOR: σ軸
    LEAST_AVIUTL_VERSION: "2005000"
    LEAST_AVIUTL_VERSION_STRING: beta50

package:
  id: ColoredCollar_S
  name: 色付き縁取りスクリプト ColoredCollar_S
  version: v2.00-dev (for beta51)
  information: "{name} {version} by {AUTHOR}"
  script_sub_dir: ""
  uninstall_sub_folder_file: false
  message:
    text: |
      # ColoredCollar_S AviUtl ExEdit2 色付き縁取りスクリプト

      オブジェクトの境界部分の色を引き延ばして縁取りするスクリプトです．縁取りの透明度を調節したり，距離に応じて 2 色に塗り分ける色グラデーションもできます．

      公開ページ:
      https://github.com/sigma-axis/aviutl2_script_ColoredCollar_S

      紹介動画:
      https://www.nicovideo.jp/watch/sm45257124

      お願い:
      ニコニコ動画での親作品登録をしていただけると励みになります．
      作品 ID: sm45257124

  assets:
    - src: README.md
      dest: Script/{id}/README.md
    - src: LICENSE
      dest: Script/{id}/LICENSE
  file_name: package.au2pkg.zip

build:
  out_dir: build

scripts:
  - name: ColoredCollar_S.anm2
    sources:
      - path: script/preamble.lua
      - path: script/main.lua
